# Settings for the test suite only. They are loaded on top of the application's own.
stockflow.jwt.secret=test-secret-with-at-least-32-bytes-000
stockflow.bootstrap-admin-password=Bootstrap-Admin-01
# The developer's own administrator (DevAdmin), created with the profile `e2e`. See DevAdminTest.
stockflow.dev-admin-password=Dev-Admin-Password-1
# High limits, so the suites do not trip the rate limit. The rate limit has its own test with low limits.
stockflow.rate-limit.login-max=100000
stockflow.rate-limit.reset-max=100000
# Printing goes to a fake printer that the label tests open on this port, and a printer that does not answer fails fast.
stockflow.printing.port=19100
stockflow.printing.timeout-ms=1000
