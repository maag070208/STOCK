# The profile e2e, for end-to-end suites on a developer's machine or in CI. Never in production.
# The suites sign in many times from one address, and fail on purpose, so the rate limit stays out of their way.
# The rate limit itself is tested by the API's own suite (RateLimitTest).
stockflow.rate-limit.login-max=100000
stockflow.rate-limit.reset-max=100000
# The web suite prints to a fake printer it opens on this port of the developer's machine (testing.md rule 7).
stockflow.printing.port=19100
