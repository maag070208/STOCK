spring.application.name=stockflow-api

# Local defaults match docker-compose.yml. The password comes from the environment (.env), never from this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/stockflow}
spring.datasource.username=${DB_USER:stockflow}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Read-only views (stock lists) are validated like tables.
spring.jpa.properties.hibernate.hbm2ddl.extra_physical_table_types=VIEW

# OpenAPI: the UI at /docs, the JSON at /docs/json, the versioned API only.
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/docs/json
springdoc.paths-to-match=/api/v1/**

# Logs: one JSON object per line (Elastic Common Schema). No personal data goes into a log message.
logging.structured.format.console=ecs

# A request with a field outside the spec is rejected with UNKNOWN_FIELD (validation.md principle 5).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Sessions (docs/modules/identity.md section 2). The secret comes from the environment and has at least 32 bytes.
stockflow.jwt.secret=${JWT_SECRET}
stockflow.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
stockflow.jwt.refresh-days=${JWT_REFRESH_DAYS:30}

# Rate limit per IP. TRUSTED_PROXY_HOPS is the number of trusted proxies in front of the API: with 0, X-Forwarded-For is ignored.
stockflow.rate-limit.window-minutes=${RATE_LIMIT_WINDOW_MINUTES:15}
stockflow.rate-limit.login-max=${RATE_LIMIT_LOGIN_MAX:20}
stockflow.rate-limit.reset-max=${RATE_LIMIT_RESET_MAX:20}
stockflow.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:0}

# The password of the first administrator. Used only while no administrator can sign in.
stockflow.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Only read with the profile `e2e` (end-to-end suites on a developer's machine or in CI). See docs/rules/testing.md.
stockflow.e2e-admin-password=${E2E_ADMIN_PASSWORD:}

# Label printing (docs/modules/labels.md sections 5 and 6): the raw port of Zebra printers, and how long a printer has
# to answer before the print fails with PRINTER_UNREACHABLE. Not per printer: the port is the same for all of them.
stockflow.printing.port=9100
stockflow.printing.timeout-ms=3000

# Uploads: the legacy inventory file is about 100 KB. Larger files are refused.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
