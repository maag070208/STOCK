# Local environment for StockFlow. Project name: stockflow.
# Old volumes from earlier projects (stockflow_pgdata, stock-postgres-data) are never used here.
name: stockflow

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The API, built from api/. Migrations run when it starts. API_PORT moves it off 8080 when that port is taken.
  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockflow
      DB_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health/ready > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  db-data:
